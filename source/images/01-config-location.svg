<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
<title id="title">两行配置放在文件顶层</title><desc id="desc">配置位置示意图：approval_policy 与 approvals_reviewer 放在第一个 TOML 区块之前。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="530" rx="24" fill="#f3f6fb"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="40" y="56" font-size="32" fill="#17243b" font-weight="700">01  配置放在文件最前面</text><text x="40" y="92" font-size="19" fill="#52637d" font-weight="400">配置位置示意图 · 当前服务器路径：/root/.codex/config.toml</text><rect x="40" y="122" width="1120" height="348" rx="14" fill="#111b2d" stroke="none" stroke-width="2"/><rect x="40" y="122" width="1120" height="48" rx="14" fill="#223048" stroke="none" stroke-width="2"/><text x="66" y="153" font-size="20" fill="#d7e3fa" font-weight="400" font-family="Consolas, monospace">config.toml</text><rect x="60" y="190" width="1080" height="92" rx="8" fill="#163c42" stroke="#48c4ad" stroke-width="2"/><text x="76" y="222" font-size="21" fill="#8192ad" font-weight="400" font-family="Consolas, monospace">1</text><text x="120" y="222" font-size="25" fill="#a8efe1" font-weight="400" font-family="Consolas, monospace">approval_policy = &quot;on-request&quot;</text><text x="76" y="258" font-size="21" fill="#8192ad" font-weight="400" font-family="Consolas, monospace">2</text><text x="120" y="258" font-size="25" fill="#a8efe1" font-weight="400" font-family="Consolas, monospace">approvals_reviewer = &quot;auto_review&quot;</text><text x="76" y="294" font-size="21" fill="#8192ad" font-weight="400" font-family="Consolas, monospace">3</text><text x="120" y="294" font-size="25" fill="#8393aa" font-weight="400" font-family="Consolas, monospace"></text><text x="76" y="330" font-size="21" fill="#8192ad" font-weight="400" font-family="Consolas, monospace">4</text><text x="120" y="330" font-size="25" fill="#aebdd2" font-weight="400"># 其余顶层设置放在这里</text><text x="76" y="377" font-size="21" fill="#8192ad" font-weight="400" font-family="Consolas, monospace">5</text><text x="120" y="377" font-size="25" fill="#f4d187" font-weight="400" font-family="Consolas, monospace">[features]</text><text x="76" y="413" font-size="21" fill="#8192ad" font-weight="400" font-family="Consolas, monospace">6</text><text x="120" y="413" font-size="25" fill="#aebdd2" font-weight="400"># 原有区块内容保持原样</text><text x="750" y="334" font-size="23" fill="#a8efe1" font-weight="600">↑ 这两行属于顶层</text><text x="750" y="383" font-size="21" fill="#f4d187" font-weight="400">第一个 [区块] 在它们下面</text><text x="40" y="509" font-size="21" fill="#52637d" font-weight="400">已有同名项时修改原值，不要重复添加；不要直接追加到某个区块末尾。</text></g></svg>