<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">选择自定义 config.toml</title><desc id="desc">根据用户提供的权限菜单截图重绘。标出自定义选项及其含义，并说明菜单名称本身不证明自动审批生效。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="560" rx="24" fill="#f3f6fb"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="40" y="56" font-size="32" fill="#17243b" font-weight="700">02  权限菜单选择“自定义”</text><text x="40" y="92" font-size="19" fill="#52637d" font-weight="400">按你提供的截图重绘并标注 · 示意图，不是新增的实机截图</text><rect x="40" y="130" width="520" height="350" rx="14" fill="#292929" stroke="none" stroke-width="2"/><text x="66" y="168" font-size="22" fill="#bebebe" font-weight="400">应如何批准 Codex 操作？</text><text x="420" y="168" font-size="19" fill="#b0b0b0" font-weight="400">了解更多</text><text x="84" y="226" font-size="25" fill="#e0e0e0" font-weight="400">请求批准</text><text x="84" y="256" font-size="18" fill="#aaa" font-weight="400">编辑外部文件和使用互联网时始终询问</text><text x="84" y="308" font-size="25" fill="#e4bf38" font-weight="400">完全访问权限</text><text x="84" y="338" font-size="18" fill="#d4b03a" font-weight="400">可不受限制地访问互联网和电脑上的任何文件</text><rect x="61" y="360" width="476" height="94" rx="10" fill="#263d3a" stroke="#5ee1bd" stroke-width="2"/><text x="84" y="397" font-size="25" fill="#e9fff8" font-weight="600">自定义（config.toml）</text><text x="84" y="427" font-size="20" fill="#b9d6ce" font-weight="400">使用 config.toml 中定义的权限</text><path d="M 541 407 L 622 407 L 622 205 L 665 205" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="683" y="146" width="477" height="138" rx="14" fill="#e5edff" stroke="none" stroke-width="2"/><text x="707" y="185" font-size="26" fill="#1d4ed8" font-weight="700">选择这一项</text><text x="707" y="224" font-size="22" fill="#17243b" font-weight="400">让插件使用配置文件中的权限设置。</text><text x="707" y="258" font-size="22" fill="#17243b" font-weight="400">名称显示为“自定义”是正常结果。</text><rect x="683" y="307" width="477" height="173" rx="14" fill="#fff" stroke="#dbe3ef" stroke-width="2"/><text x="707" y="350" font-size="24" fill="#17243b" font-weight="600">下一步：验证实际生效状态</text><text x="707" y="391" font-size="22" fill="#17243b" font-weight="400">检查会话中的 auto_review，</text><text x="707" y="427" font-size="21" fill="#17243b" font-weight="400">再做一次明确申请权限的临时文件测试。</text><text x="40" y="523" font-size="20" fill="#52637d" font-weight="400">标框表示教程建议选择的选项；原截图本身不能确认自动审批是否已生效。</text></g></svg>